[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "tqdm>=4.66.0",
    "xxhash",
]

[project.optional-dependencies]
online = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
nanovllm-serve = "nanovllm.serve.sse:main"

[project.urls]
Homepage = "https://github.com/zhengwenze/zwz-vllm-lab"
Upstream = "https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
